name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilation, tests et build TeaVM
        run: ./gradlew --no-daemon --stacktrace build :teavm:gdx_teavm_web_js_build

      - name: Simulation d'équilibrage
        run: ./gradlew --no-daemon :core:simulate

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test de fumée dans Chromium
        run: |
          cd tools/smoke-test
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          (cd ../../teavm/build/dist/js/webapp && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          node smoke.mjs http://localhost:8000/ ../../screenshots

      - name: Captures en base64 (lisibles dans les logs, hors main)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "::group::$f"; echo "BEGIN $f"; base64 -w 2000 "$f"; echo "END $f"; echo "::endgroup::"
          done

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Build web (pour Cloudflare)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: teavm/build/dist/js/webapp
          retention-days: 7

  # ---------------------------------------------------------------- Cloudflare Workers (static assets)
  # Nécessite les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (voir docs/DEPLOIEMENT-CLOUDFLARE.md).
  # Sans ces secrets, les jobs se terminent sans rien déployer.

  cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Vérifier la configuration Cloudflare
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Cloudflare non configuré::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour activer le déploiement."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.configured == 'true'
        with:
          name: webapp
          path: teavm/build/dist/js/webapp

      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Diagnostic du jeton (comptes accessibles)
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 whoami || true

      - name: Déploiement en production
        id: deploy
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --message "main ${GITHUB_SHA::7}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Déployé sur Cloudflare : $url" >> "$GITHUB_STEP_SUMMARY"

  cloudflare-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier la configuration Cloudflare
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Cloudflare non configuré::Pas d'aperçu Cloudflare (secrets absents)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.configured == 'true'
        with:
          name: webapp
          path: teavm/build/dist/js/webapp

      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Version d'aperçu (sans toucher à la production)
        id: preview
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 versions upload --preview-alias "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}" 2>&1 | tee upload.log; then
            if grep -q "does not yet exist" upload.log; then
              echo "::notice title=Pas encore d'aperçu::Le Worker n'existe pas encore : il sera créé au premier déploiement de main."
              exit 0
            fi
            exit 1
          fi
          url=$(grep -oE "https://pr-$PR-[a-zA-Z0-9.-]+\.workers\.dev" upload.log | head -1)
          [ -z "$url" ] && url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Aperçu Cloudflare : $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Commentaire sur la PR
        if: steps.check.outputs.configured == 'true' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          marker="<!-- apercu-cloudflare -->"
          body="$marker
          🎮 **Aperçu Cloudflare** de cette PR : $URL
          (commit ${GITHUB_SHA::7}, mis à jour à chaque push)"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" > /dev/null
          fi
