name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilation, tests et build TeaVM
        run: ./gradlew --no-daemon --stacktrace build :teavm:gdx_teavm_web_js_build

      - name: Simulation d'équilibrage
        run: ./gradlew --no-daemon :core:simulate

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test de fumée dans Chromium
        run: |
          cd tools/smoke-test
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          (cd ../../teavm/build/dist/js/webapp && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          node smoke.mjs http://localhost:8000/ ../../screenshots

      - name: Captures en base64 (lisibles dans les logs, hors main)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "::group::$f"; echo "BEGIN $f"; base64 -w 2000 "$f"; echo "END $f"; echo "::endgroup::"
          done

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Artefact GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: teavm/build/dist/js/webapp

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
