name: CLAUDE.md à jour

# Chaque PR doit mettre à jour CLAUDE.md (le contexte projet lu par Claude).
# Exception possible avec le label « skip-claude-md » (ex. : simple correction de typo).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que CLAUDE.md est modifié
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-claude-md') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          echo "Fichiers modifiés :"; echo "$files"
          if ! echo "$files" | grep -qx 'CLAUDE.md'; then
            echo "::error title=CLAUDE.md non mis à jour::Cette PR doit mettre à jour CLAUDE.md (structure, commandes, décisions, état du projet). Pour une exception, ajoute le label skip-claude-md."
            exit 1
          fi
          echo "CLAUDE.md est bien mis à jour."
